<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ニコょし{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">ニコ動<span>ょし</span></a>
  <form action="/search" method="get" class="topsearch">
    <input type="search" name="q" placeholder="キーワード・タグで検索" value="{{ q or '' }}">
    <button>検索</button>
  </form>
  <nav>
    <a href="/ranking">ランキング</a>
    <a href="/history">履歴</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  非公式ビューア / 動画情報はニコニコ動画 スナップショット検索API より取得
</footer>
</body>
</html>
