{% extends "base.html" %}
{% block title %}{{ video.title }} - ニコ動ビューア %}
{% block content %}
<link rel="stylesheet" href="/static/watch.css">
<div class="player" id="player"></div>
<pre id="log"></pre>
<div id="body"></div>
<script type="application/json" id="vd">{{ {
  "id": video.id, "title": video.title, "embed": embed, "thumb": video.thumb,
  "views": video.views, "comments": video.comments, "mylists": video.mylists,
  "likes": video.likes, "start": video.start, "tags": video.tags,
  "related": related
} | tojson }}</script>
<script src="/static/watch.js"></script>
{% endblock %}
